name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: |
          pnpm prisma generate --schema=prisma/assessment/schema.prisma
          pnpm prisma generate --schema=prisma/user/schema.prisma

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit
        env:
          CI: true
          TEST_ONLINE: "0"

      - name: Build
        run: pnpm build
        env:
          CI: true
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/assessment?schema=public"
          USER_DATABASE: "postgresql://ci:ci@localhost:5432/user?schema=public"
          DIRECT_URL: "postgresql://ci:ci@localhost:5432/assessment?schema=public"
          NEXTAUTH_SECRET: "ci-nextauth-secret-not-for-production"
          NEXTAUTH_URL: "http://localhost:3000"
          NEXT_PUBLIC_BASE_URL: "http://localhost:3000"
